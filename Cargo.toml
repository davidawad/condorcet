[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.82"

[workspace.lints.clippy]
too_many_lines = "warn"
too_many_arguments = "warn"
type_complexity = "warn"

[workspace.dependencies]
condorcet-core = { path = "crates/core" }
condorcet-adapter = { path = "crates/adapter" }
condorcet-composer = { path = "crates/composer" }
condorcet-sat = { path = "crates/sat" }
condorcet-wmc = { path = "crates/wmc" }
condorcet-dung = { path = "crates/dung" }
condorcet-jury = { path = "crates/jury" }
condorcet-store = { path = "crates/store" }
rustsat = { version = "0.7.5", default-features = false }
rustsat-batsat = "0.7.5"
proptest = { version = "1", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
thiserror = "2"
jsonschema = { version = "0.56", default-features = false }
